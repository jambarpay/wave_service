name: Kubernetes Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'jambarpay' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${VPS_SSH_KEY}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Collect cluster diagnostics
        env:
          SSH_OPTS: -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6
        run: |
          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" "bash -s -- '${K8S_NAMESPACE}'" < .github/scripts/diagnose-wave-deployment.sh
