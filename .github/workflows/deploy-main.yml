name: Deploy On Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wave-service-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wave-service
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'jambarpay' }}
  GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
  GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
  WAVE_SERVICE_ENV: ${{ secrets.WAVE_SERVICE_ENV }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${VPS_SSH_KEY}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Prepare deployment bundle
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p deploy
          bash .github/scripts/render-wave-manifest.sh > deploy/manifest.yaml
          printf '%s\n' "${WAVE_SERVICE_ENV}" > deploy/service.env

      - name: Copy deployment bundle to VPS
        env:
          SSH_OPTS: -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6
        run: |
          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" "mkdir -p /tmp/${GITHUB_REPOSITORY#*/}-wave-service"
          scp ${SSH_OPTS} deploy/manifest.yaml deploy/service.env "${VPS_USER}@${VPS_HOST}:/tmp/${GITHUB_REPOSITORY#*/}-wave-service/"

      - name: Deploy to Kubernetes
        env:
          SSH_OPTS: -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6
        run: |
          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            kubectl create namespace ${K8S_NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n ${K8S_NAMESPACE} create secret docker-registry ghcr-auth \
              --docker-server=${REGISTRY} \
              --docker-username='${GHCR_PULL_USERNAME}' \
              --docker-password='${GHCR_PULL_TOKEN}' \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n ${K8S_NAMESPACE} create secret generic wave-service-env \
              --from-env-file=/tmp/${GITHUB_REPOSITORY#*/}-wave-service/service.env \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f /tmp/${GITHUB_REPOSITORY#*/}-wave-service/manifest.yaml
            kubectl -n ${K8S_NAMESPACE} rollout status deployment/wave-service --timeout=600s
          "

      - name: Diagnose deployment
        if: always()
        env:
          SSH_OPTS: -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6
        run: |
          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" "
            set +e
            echo '=== DEPLOYMENT ==='
            kubectl -n ${K8S_NAMESPACE} get deployment wave-service -o wide
            echo '=== SERVICE ==='
            kubectl -n ${K8S_NAMESPACE} get svc wave-service -o wide
            echo '=== PODS ==='
            kubectl -n ${K8S_NAMESPACE} get pods -l app=wave-service -o wide
            echo '=== DESCRIBE DEPLOYMENT ==='
            kubectl -n ${K8S_NAMESPACE} describe deployment wave-service
            echo '=== DESCRIBE PODS ==='
            kubectl -n ${K8S_NAMESPACE} describe pods -l app=wave-service
            echo '=== LOGS ==='
            kubectl -n ${K8S_NAMESPACE} logs deployment/wave-service --tail=200
            echo '=== LATEST EVENTS ==='
            kubectl -n ${K8S_NAMESPACE} get events --sort-by=.metadata.creationTimestamp | tail -n 50
          "
