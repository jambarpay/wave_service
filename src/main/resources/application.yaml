server:
  port: ${WAVE_SERVICE_PORT:8088}

spring:
  application:
    name: ${WAVE_SERVICE_NAME:wave-service}

  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}

  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${spring.application.name}}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    instance-id: ${spring.application.name}:${server.port}

wave:
  providers:
    paydunya:
      sandbox: ${PAYDUNYA_SANDBOX:true}
      master-key: ${PAYDUNYA_MASTER_KEY:}
      private-key: ${PAYDUNYA_PRIVATE_KEY:}
      token: ${PAYDUNYA_TOKEN:}
      store-name: ${PAYDUNYA_STORE_NAME:JambaarPay}

security:
  jwt:
    issuer: ${JWT_ISSUER:jambaarpay-user-service}
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.jambarpay.waveservice: INFO
